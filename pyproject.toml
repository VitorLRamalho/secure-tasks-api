[project]
name = "secure-tasks-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # asserts e senhas de teste

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # coloca a raiz do projeto no sys.path para `import app` funcionar nos testes
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
