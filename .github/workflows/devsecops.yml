name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio por padrão; cada job pede só o que precisa
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # histórico completo: um segredo "removido" depois ainda está no Git
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publica os achados na aba Security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install semgrep "bandit[toml,sarif]"
      - name: Semgrep (OWASP Top 10, Python, segredos, Dockerfile)
        run: >
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/python
          --config p/secrets --config p/dockerfile
          --sarif --output semgrep.sarif
      - name: Bandit
        if: always()
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --severity-level medium
      - uses: github/codeql-action/upload-sarif@e1c541575b54ca50e5f5dcc7da77615756cf9f51 # v3.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/upload-sarif@e1c541575b54ca50e5f5dcc7da77615756cf9f51 # v3.39.1
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  sca:
    name: SCA + IaC (pip-audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - name: pip-audit (falha em qualquer CVE conhecida)
        run: pip-audit --strict
      - name: Trivy — Dockerfile, configurações e segredos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@e1c541575b54ca50e5f5dcc7da77615756cf9f51 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build:
    name: Build → scan da imagem → SBOM
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-test, sast, sca]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Nome da imagem (o GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build local (sem push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — CVEs da imagem (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@e1c541575b54ca50e5f5dcc7da77615756cf9f51 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM (CycloneDX) com Syft
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ${{ env.IMAGE }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Guardar imagem e SBOM para os jobs seguintes
        run: docker save "$IMAGE:ci" -o image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
