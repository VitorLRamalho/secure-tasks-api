name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio por padrão; cada job pede só o que precisa
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo: um segredo "removido" depois ainda está no Git
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publica os achados na aba Security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep "bandit[toml,sarif]"
      - name: Semgrep (OWASP Top 10, Python, segredos, Dockerfile)
        run: >
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/python
          --config p/secrets --config p/dockerfile
          --sarif --output semgrep.sarif
      - name: Bandit
        if: always()
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --severity-level medium
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  sca:
    name: SCA + IaC (pip-audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - name: pip-audit (falha em qualquer CVE conhecida)
        run: pip-audit --strict
      - name: Trivy — Dockerfile, configurações e segredos
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build:
    name: Build → scan da imagem → SBOM
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-test, sast, sca]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Nome da imagem (o GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build local (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — CVEs da imagem (gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM (CycloneDX) com Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Guardar imagem e SBOM para os jobs seguintes
        run: docker save "$IMAGE:ci" -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
