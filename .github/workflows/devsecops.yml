name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Menor privilégio por padrão; cada job pede só o que precisa
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # histórico completo: um segredo "removido" depois ainda está no Git
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-test:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  sast:
    name: SAST (Semgrep + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # publica os achados na aba Security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-sast.txt
      - name: Semgrep (OWASP Top 10, Python, segredos, Dockerfile)
        run: >
          semgrep scan --metrics=off --error
          --config p/owasp-top-ten --config p/python
          --config p/secrets --config p/dockerfile
          --sarif --output semgrep.sarif
      - name: Bandit
        if: always()
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif --severity-level medium
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  sca:
    name: SCA + IaC (pip-audit + Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt   # o pip-audit vem do dev.txt, com hash
      - name: pip-audit (falha em qualquer CVE conhecida)
        run: pip-audit --strict
      - name: Trivy — Dockerfile, configurações e segredos
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true   # sem isso, o SARIF ignora o filtro de severidade
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always() && hashFiles('trivy-fs.sarif') != ''      # no job sca
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  build:
    name: Build → scan da imagem → SBOM
    runs-on: ubuntu-latest
    needs: [secret-scan, lint-test, sast, sca]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Nome da imagem (o GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build local (sem push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — CVEs da imagem (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true   # sem isso, o SARIF ignora o filtro de severidade
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always() && hashFiles('trivy-image.sarif') != ''   # no job build
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: SBOM (CycloneDX) com Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Guardar imagem e SBOM para os jobs seguintes
        run: docker save "$IMAGE:ci" -o image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: image.tar
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  dast:
    name: DAST (OWASP ZAP, autenticado)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - name: Subir a imagem já verificada
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:ci"
          docker load -i image.tar
          docker run -d --name api -p 8000:8000 \
            -e APP_JWT_SECRET="$(openssl rand -hex 32)" "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fs http://localhost:8000/health && break
            sleep 1
          done
      - name: Criar usuário de scan e obter token
        id: auth
        run: |
          curl -fs -X POST http://localhost:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"zap@example.com","password":"ZapScannerPassword2026"}'
          LOGIN=$(curl -fs -X POST http://localhost:8000/auth/login \
            -d 'username=zap@example.com&password=ZapScannerPassword2026')
          # sem pipe de curl para interpretador: o Semgrep (gha-curl-pipe-shell) leria como "curl | bash"
          TOKEN=$(python3 -c 'import sys, json; print(json.loads(sys.argv[1])["access_token"])' "$LOGIN")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: ZAP API scan (falha só nas regras marcadas como FAIL)
        env:
          ZAP_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          chmod a+w zap
          # --network host + localhost: no runner o Docker é nativo (local é host.docker.internal)
          docker run --rm --network host -e ZAP_TOKEN -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json -f openapi \
            -c api-scan.conf --hook /zap/wrk/auth-hook.py -I \
            -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-report
          path: zap/zap-report.*
      - name: Logs da aplicação (diagnóstico)
        if: always()
        run: docker logs api

  release:
    name: Publicar e assinar (só na main)
    runs-on: ubuntu-latest
    needs: dast
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write     # push no GHCR
      id-token: write     # OIDC: assinatura keyless com Cosign, sem chave guardada
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Push da imagem verificada, assinatura e atestado do SBOM
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker load -i image.tar
          docker tag "$IMAGE:ci" "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA" | cut -d@ -f2)
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
          echo "Imagem publicada e assinada: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
